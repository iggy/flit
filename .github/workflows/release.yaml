name: Release

# Builds every platform target on a version tag (e.g. `v1.2.3`), packages
# each into a distributable artifact, and uploads them to a GitHub Release
# attached to the tag. The build matrix mirrors CI so the same targets stay
# in sync.
#
# Trigger: push of a tag matching `v*` (e.g. v1.0.0, v1.0.0-rc.1).
# The tag name (without leading `v`) is used as the release version.
#
# Notes:
# - All Flutter commands run in app/ (Flutter project is not at repo root).
# - Linux produces an AppImage, macOS a DMG, Windows a ZIP, Android the APK,
#   web a ZIP, iOS a zipped unsigned .app (no codesign in CI).
# - Code signing / notarization is out of scope; artifacts are unsigned.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to publish (must already exist)'
        required: true

permissions:
  contents: write   # required by softprops/action-gh-release to create the release

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
          - target: web
            runner: ubuntu-latest
          - target: android-apk
            runner: ubuntu-latest
          - target: macos
            runner: macos-latest
          - target: ios
            runner: macos-latest
          - target: windows
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release version from tag
        id: ver
        shell: bash
        working-directory: app
        run: |
          # The git tag (sans leading `v`) is the source of truth for release
          # version. e.g. tag `v0.0.3` -> version `0.0.3`.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          ver="${tag#v}"
          # Reject malformed tags early; otherwise assets become e.g.
          # `flit--android.apk`.
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+].*)?$'; then
            echo "::error::Tag '$tag' does not look like vX.Y.Z"
            exit 1
          fi
          echo "tag=$tag"    >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Stamp version into pubspec.yaml
        shell: bash
        working-directory: app
        run: |
          # Rewrite pubspec's `version:` line to the tag version so the built
          # binaries self-identify as the tag version (versionName on Android,
          # CFBundleShortVersionString on iOS, product version on Windows).
          # Build number resets to 1 each release.
          ver="${{ steps.ver.outputs.version }}"
          if ! grep -Eq '^version:[[:space:]]*[0-9]' pubspec.yaml; then
            echo "::error::no 'version:' line in pubspec.yaml to stamp"
            exit 1
          fi
          sed -i -E "s|^version:[[:space:]].*|version: ${ver}+1|" pubspec.yaml
          grep -E '^version:' pubspec.yaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0-0.2.pre
          channel: beta
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install appimagetool
        if: matrix.target == 'linux'
        run: |
          # linux_appimage.sh expects `appimagetool` on PATH.
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          # appimagetool is itself an AppImage; it needs FUSE on the runner.
          sudo add-apt-repository -y universe
          sudo apt-get install -y libfuse2

      - name: Install rpmbuild
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # ---------------------------------------------------------------------
      # Linux -> AppImage
      # ---------------------------------------------------------------------
      - name: Build & package Linux AppImage
        if: matrix.target == 'linux'
        run: ./packaging/linux_appimage.sh

      - name: Build & package Linux deb/rpm
        if: matrix.target == 'linux'
        run: ./packaging/linux_packages.sh

      - name: Build & package Linux binary bundle
        if: matrix.target == 'linux'
        run: ./packaging/linux_binary.sh

      - name: Archive Linux binary bundle
        if: matrix.target == 'linux'
        run: |
          cd build/linux
          zip -r flit-linux-x64.zip flit-linux-x64/
          cd ../..
          mv build/linux/flit-linux-x64.zip build/flit-linux-x64.zip

      - name: Upload Linux AppImage artifact
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: app/build/linux/flit-x86_64.AppImage
          if-no-files-found: error

      - name: Upload Linux deb/rpm artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-packages
          path: |
            app/build/linux/*.deb
            app/build/linux/*.rpm
          if-no-files-found: error

      - name: Upload Linux binary bundle artifact
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-binary
          path: app/build/flit-linux-x64.zip
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Web -> ZIP
      # ---------------------------------------------------------------------
      - name: Build Web
        if: matrix.target == 'web'
        run: flutter build web --release

      - name: Archive Web build
        if: matrix.target == 'web'
        run: |
          cd build/web && zip -r ../../flit-web.zip . && cd ../..
          mv flit-web.zip build/flit-web.zip

      - name: Upload Web artifact
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: app/build/flit-web.zip
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Android -> APK
      # ---------------------------------------------------------------------
      - name: Build Android APK
        if: matrix.target == 'android-apk'
        run: flutter build apk --release

      - name: Upload Android APK artifact
        if: matrix.target == 'android-apk'
        uses: actions/upload-artifact@v7
        with:
          name: release-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # macOS -> DMG
      # ---------------------------------------------------------------------
      - name: Build & package macOS DMG
        if: matrix.target == 'macos'
        run: ./packaging/macos_dmg.sh

      - name: Upload macOS artifact
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: app/build/macos/flit.dmg
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # iOS -> unsigned .app ZIP
      # ---------------------------------------------------------------------
      - name: Build iOS (no codesign)
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Archive iOS build
        if: matrix.target == 'ios'
        run: |
          cd build/ios/iphoneos
          zip -r ../../../flit-ios-unsigned.zip *.app
          cd ../../..
          mv flit-ios-unsigned.zip build/flit-ios-unsigned.zip

      - name: Upload iOS artifact
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: app/build/flit-ios-unsigned.zip
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Windows -> ZIP
      # ---------------------------------------------------------------------
      - name: Build & package Windows ZIP
        if: matrix.target == 'windows'
        shell: pwsh
        run: powershell -File packaging/windows_msi.ps1

      - name: Upload Windows artifact
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: app/build/windows/flit-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release version from tag
        id: ver
        shell: bash
        working-directory: app
        run: |
          # Same logic as the build job's `ver` step — keep them in lockstep.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          ver="${tag#v}"
          echo "name=$tag"    >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Normalize asset names
        working-directory: release-assets
        run: |
          # Prefix every artifact with the version so downloads are self-describing.
          ver="${{ steps.ver.outputs.version }}"
          for f in *; do
            case "$f" in
              flit-x86_64.AppImage)  mv "$f" "flit-${ver}-linux-x86_64.AppImage" ;;
              flit-web.zip)          mv "$f" "flit-${ver}-web.zip" ;;
              flit-ios-unsigned.zip) mv "$f" "flit-${ver}-ios-unsigned.zip" ;;
              flit-windows-x64.zip)  mv "$f" "flit-${ver}-windows-x64.zip" ;;
              flit-linux-x64.zip)    mv "$f" "flit-${ver}-linux-x64.zip" ;;
              flit.dmg)              mv "$f" "flit-${ver}-macos.dmg" ;;
              *.apk)                 mv "$f" "flit-${ver}-android.apk" ;;
              *.deb)                 mv "$f" "flit-${ver}-linux.deb" ;;
              *.rpm)                 mv "$f" "flit-${ver}-linux.rpm" ;;
              *) echo "Leaving $f as-is" ;;
            esac
          done
          ls -la

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.name }}
          name: ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.name, '-') }}
          files: release-assets/*
