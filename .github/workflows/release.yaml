name: Release

# Builds every platform target on a version tag (e.g. `v1.2.3`), packages
# each into a distributable artifact, and uploads them to a GitHub Release
# attached to the tag. The build matrix mirrors CI so the same targets stay
# in sync.
#
# Trigger: push of a tag matching `v*` (e.g. v1.0.0, v1.0.0-rc.1).
# The tag name (without leading `v`) is used as the release version.
#
# Notes:
# - All Flutter commands run in app/ (Flutter project is not at repo root).
# - Linux produces an AppImage, macOS a DMG, Windows a ZIP, Android the APK,
#   web a ZIP, iOS a zipped unsigned .app (no codesign in CI).
# - Code signing / notarization is out of scope; artifacts are unsigned.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to publish (must already exist)'
        required: true

permissions:
  contents: write   # required by softprops/action-gh-release to create the release

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
          - target: web
            runner: ubuntu-latest
          - target: android-apk
            runner: ubuntu-latest
          - target: macos
            runner: macos-latest
          - target: ios
            runner: macos-latest
          - target: windows
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Install appimagetool
        if: matrix.target == 'linux'
        run: |
          # linux_appimage.sh expects `appimagetool` on PATH.
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          # appimagetool is itself an AppImage; it needs FUSE on the runner.
          sudo add-apt-repository -y universe
          sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # ---------------------------------------------------------------------
      # Linux -> AppImage
      # ---------------------------------------------------------------------
      - name: Build & package Linux AppImage
        if: matrix.target == 'linux'
        run: ./packaging/linux_appimage.sh

      - name: Upload Linux artifact
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: app/build/linux/flit-x86_64.AppImage
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Web -> ZIP
      # ---------------------------------------------------------------------
      - name: Build Web
        if: matrix.target == 'web'
        run: flutter build web --release

      - name: Archive Web build
        if: matrix.target == 'web'
        run: |
          cd build/web && zip -r ../../flit-web.zip . && cd ../..
          mv flit-web.zip build/flit-web.zip

      - name: Upload Web artifact
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: app/build/flit-web.zip
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Android -> APK
      # ---------------------------------------------------------------------
      - name: Build Android APK
        if: matrix.target == 'android-apk'
        run: flutter build apk --release

      - name: Upload Android APK artifact
        if: matrix.target == 'android-apk'
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # macOS -> DMG
      # ---------------------------------------------------------------------
      - name: Build & package macOS DMG
        if: matrix.target == 'macos'
        run: ./packaging/macos_dmg.sh

      - name: Upload macOS artifact
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: app/build/macos/flit.dmg
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # iOS -> unsigned .app ZIP
      # ---------------------------------------------------------------------
      - name: Build iOS (no codesign)
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Archive iOS build
        if: matrix.target == 'ios'
        run: |
          cd build/ios/iphoneos
          zip -r ../../../flit-ios-unsigned.zip *.app
          cd ../../..
          mv flit-ios-unsigned.zip build/flit-ios-unsigned.zip

      - name: Upload iOS artifact
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: app/build/flit-ios-unsigned.zip
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Windows -> ZIP
      # ---------------------------------------------------------------------
      - name: Build & package Windows ZIP
        if: matrix.target == 'windows'
        shell: pwsh
        run: powershell -File packaging/windows_msi.ps1

      - name: Upload Windows artifact
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: app/build/windows/flit-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version from pubspec
        id: ver
        working-directory: app
        run: |
          # pubspec.yaml `version: X.Y.Z+N` -> extract X.Y.Z
          v=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d+ -f1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Normalize asset names
        working-directory: release-assets
        run: |
          # Prefix every artifact with the version so downloads are self-describing.
          ver="${{ steps.ver.outputs.version }}"
          for f in *; do
            ext="${f##*.}"
            base="${f%.*}"
            case "$f" in
              flit-x86_64.AppImage) mv "$f" "flit-${ver}-linux-x86_64.AppImage" ;;
              flit-web.zip)         mv "$f" "flit-${ver}-web.zip" ;;
              flit-ios-unsigned.zip) mv "$f" "flit-${ver}-ios-unsigned.zip" ;;
              flit-windows-x64.zip) mv "$f" "flit-${ver}-windows-x64.zip" ;;
              flit.dmg)             mv "$f" "flit-${ver}-macos.dmg" ;;
              *.apk)                mv "$f" "flit-${ver}-android.apk" ;;
              *) echo "Leaving $f as-is" ;;
            esac
          done
          ls -la

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: release-assets/*
