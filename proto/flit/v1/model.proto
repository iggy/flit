syntax = "proto3";

package flit.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/iggy/flit/server/gen/flit/v1;flitv1";

// ModelService lists the models flit can use. Models are discovered from
// each configured provider's /models endpoint (there is no built-in model
// database) and can be corrected or filled in by a YAML override file.
// Discovery runs when the server starts and on Refresh.
service ModelService {
  // ListProviders lists the configured providers and how discovery went.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListModels lists the discovered models, optionally for one provider.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Refresh re-runs discovery (and re-reads the override file).
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // SetFavorite stars or unstars a model. Favorites (and recently used
  // models) are kept on the server, so every device sees the same ones.
  rpc SetFavorite(SetFavoriteRequest) returns (SetFavoriteResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // LoadModel and UnloadModel ask a llama.cpp router (Provider
  // can_load_models) to load or unload a model, then refresh that
  // provider. Other providers return FAILED_PRECONDITION.
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
  rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);
}

// ProviderKind is how flit reads a provider's /models response. AUTO
// detects it from the URL and the response.
enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_OPENAI = 1;
  PROVIDER_KIND_OPENROUTER = 2;
  PROVIDER_KIND_LLAMACPP = 3;
  PROVIDER_KIND_GOMODEL = 4;
}

message Provider {
  string name = 1;
  string base_url = 2;
  // The kind discovery detected or the config set.
  ProviderKind kind = 3;
  int32 model_count = 4;
  // When discovery last finished, and its error if it failed.
  google.protobuf.Timestamp refresh_time = 5;
  string error = 6;
  // Whether flit can load and unload this provider's models (a llama.cpp
  // router).
  bool can_load_models = 7;
}

// ModelState is a llama.cpp router model's state.
enum ModelState {
  // Not reported (not a router).
  MODEL_STATE_UNSPECIFIED = 0;
  MODEL_STATE_UNLOADED = 1;
  MODEL_STATE_LOADING = 2;
  MODEL_STATE_LOADED = 3;
  // Loaded but idle and swapped out; wakes on the next request.
  MODEL_STATE_SLEEPING = 4;
  // The last load failed.
  MODEL_STATE_FAILED = 5;
}

message Model {
  string provider = 1;
  string id = 2;
  string display_name = 3;
  // Context window in tokens; 0 if unknown.
  int64 context_length = 4;
  bool supports_tools = 5;
  bool supports_reasoning = 6;
  bool supports_vision = 7;
  // Reasoning effort levels the model accepts, e.g. ["low","medium","high"].
  repeated string efforts = 8;
  // llama.cpp router: whether the model is loaded right now.
  bool loaded = 9;
  // Whether discovery found it and whether the override file touched it.
  bool discovered = 10;
  bool overridden = 11;
  // Starred (SetFavorite).
  bool favorite = 12;
  // When a session last used it (set its model, or ran a turn on it);
  // unset if never.
  google.protobuf.Timestamp last_used = 13;
  ModelState state = 14;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

message ListModelsRequest {
  // Empty means all providers.
  string provider = 1;
}

message ListModelsResponse {
  repeated Model models = 1;
}

message RefreshRequest {
  // Empty means all providers.
  string provider = 1;
}

message RefreshResponse {
  repeated Provider providers = 1;
}

message SetFavoriteRequest {
  string provider = 1;
  string model = 2;
  bool favorite = 3;
}

message SetFavoriteResponse {}

message LoadModelRequest {
  string provider = 1;
  string model = 2;
}

message LoadModelResponse {
  // The model as it is after the provider was refreshed.
  Model model = 1;
}

message UnloadModelRequest {
  string provider = 1;
  string model = 2;
}

message UnloadModelResponse {
  Model model = 1;
}
